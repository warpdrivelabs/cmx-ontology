[package]
name = "cmx-onto-model"
version.workspace = true
edition.workspace = true
authors.workspace = true

# 本体平台的**语义中立内核**：本体元模型（对象/属性/关系/接口/共享属性/动作/函数类型）、
# 类型清单/版本 DTO、驱动无关的 OntologyStore 持久化契约、错误类型。对标 Palantir Foundry
# Ontology 的 Object/Property/Link/Interface/Action/Function Type，按 Rust 习惯重写：不依赖任何
# 数据库驱动、任何 cmx-* infra，可 wasm / 嵌入式复用（与 cmx-rule-model / cmx-flow-model 同纪律）。

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
