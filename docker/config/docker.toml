# cmx-onto-server 容器配置模板（挂载覆盖 /app/config；数据库为占位地址）
# 宿主侧服务用 host.docker.internal（docker run 需 --add-host=...:host-gateway）。

[server]
host = "0.0.0.0"
port = 8097
log_dir = "logs"
log_level = "info"
graceful_timeout_secs = 10

[[databases]]
db_id = "onto_pg"
db_name = "本体平台库"
db_type = "postgres"
db_url = "postgres://postgres:postgres@host.docker.internal:5432/cmx_fico"
default = true

# 认证：jwt = 委托令牌验签取真实用户身份（off 模式租户取 X-Tenant 头，越权隐患）。
# jwt_secret 必须 = 平台签发 JWT 的密钥（cmx-auth JwtConfig 默认 secret）；api_keys 接受门户反代注入的 X-API-Key
[auth]
mode = "jwt"
tenancy = "single"
jwt_alg = "HS256"
jwt_secret = "a7k9m2p4x8q1w5e3r6t0y7u2i9o4p1"
jwt_tenant_claim = "tenant"
jwt_roles_claim = "roles"
api_keys = "cmx_sk_dev_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6:default"

# 页面资产（镜像内随包 cmx-container/assets/onto：四区本体设计工作台 + 本体图组件）
[assets]
ui_native_dir = "/app/assets/onto/web/ui-native"
