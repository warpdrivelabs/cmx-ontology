<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI','PingFang SC',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0e1c"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t{fill:#e6ecf5} .m{fill:#94a3b8} .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
      .cap{font-weight:700;letter-spacing:.3px} .badge{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="780" fill="url(#bg1)"/>

  <!-- title -->
  <text x="40" y="46" class="t cap" font-size="26">cmx-ontology · Palantir 式企业本体平台</text>
  <text x="40" y="72" class="m" font-size="14">Rust「一芯多壳」独立微服务 · <tspan class="mono" fill="#22d3ee">:8097</tspan> · 依赖反转（外壳 → 中立核 → 实现 → 芯）</text>
  <rect x="1010" y="26" width="150" height="34" rx="17" fill="#0f1a2e" stroke="#22c55e"/>
  <text x="1085" y="48" text-anchor="middle" fill="#22c55e" class="badge" font-size="13">O0·O1·O2 已交付</text>

  <!-- Row: 前端接入 -->
  <rect x="40" y="98" width="760" height="86" rx="12" fill="#101a30" stroke="#243049"/>
  <text x="58" y="122" class="m cap" font-size="12">前端接入层</text>
  <rect x="58" y="132" width="330" height="40" rx="8" fill="#0d1526" stroke="#334">
    </rect>
  <text x="72" y="150" class="t" font-size="13">门户 <tspan class="mono" fill="#22d3ee">/portal</tspan>（cmx-portal-app）</text>
  <text x="72" y="166" class="m" font-size="11">DAM 导航 · openNode → 四区工作台</text>
  <rect x="406" y="132" width="376" height="40" rx="8" fill="#0d1526" stroke="#334"/>
  <text x="420" y="150" class="t" font-size="13">本体设计工作台 <tspan class="mono m">portal.onto.designer</tspan></text>
  <text x="420" y="166" class="m" font-size="11">&lt;cmx-ontology-graph&gt; 组件 · model/explorer/content/property</text>

  <!-- ecosystem sidebar -->
  <rect x="828" y="98" width="332" height="470" rx="12" fill="#0e1526" stroke="#243049"/>
  <text x="846" y="122" class="cap" fill="#a78bfa" font-size="12">cmx-* 生态复用（依赖反转注入）</text>
  <g font-size="12.5">
    <rect x="846" y="134" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="152" class="t">cmx-rulesengine</text><text x="860" y="169" class="m" font-size="11">动作/属性校验（FEEL/决策表）· O4</text>
    <rect x="846" y="186" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="204" class="t">cmx-flowengine</text><text x="860" y="221" class="m" font-size="11">动作副作用编排（Outbox → 流程）· O4</text>
    <rect x="846" y="238" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="256" class="t">cmx-data-auth</text><text x="860" y="273" class="m" font-size="11">对象/行/列 + ReBAC + Marking · O6</text>
    <rect x="846" y="290" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="308" class="t">cmx-hierarchy · cmx-agg</text><text x="860" y="325" class="m" font-size="11">层级 + 聚合（GMV/Count）· O5</text>
    <rect x="846" y="342" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="360" class="t">@cmx/decision-graph</text><text x="860" y="377" class="m" font-size="11">图编辑范式借鉴（不改造）</text>
    <rect x="846" y="394" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="412" class="t">DimensionResolver · FEEL</text><text x="860" y="429" class="m" font-size="11">维度解析 / 表达式（跨引擎共用）</text>
    <rect x="846" y="446" width="296" height="46" rx="8" fill="#131b30" stroke="#2b3a57"/>
    <text x="860" y="464" class="t">cmx-web-chassis</text><text x="860" y="481" class="m" font-size="11">启动装配 · 多租户 · 监控 · 认证</text>
  </g>
  <text x="846" y="520" class="m" font-size="11">复用既有能力，本体层只做「本体语义」编排，</text>
  <text x="846" y="537" class="m" font-size="11">不重复造校验/流程/权限/聚合轮子。</text>

  <!-- one-core-multi-shell vertical stack -->
  <g>
    <!-- shells -->
    <rect x="40" y="206" width="760" height="70" rx="12" fill="#10182c" stroke="#2b3a57"/>
    <text x="58" y="230" class="m cap" font-size="12">壳层 Shells（可执行/接入形态，薄）</text>
    <rect x="58" y="238" width="360" height="30" rx="7" fill="#0d1526" stroke="#3a4d73"/>
    <text x="72" y="258" class="t" font-size="12.5"><tspan class="mono" fill="#22d3ee">cmx-onto-server</tspan> — 独立 bin :8097（本方案主壳）</text>
    <rect x="428" y="238" width="354" height="30" rx="7" fill="#0d1526" stroke="#3a4d73"/>
    <text x="442" y="258" class="t" font-size="12.5"><tspan class="mono" fill="#22d3ee">cmx-onto-api</tspan> — 门户内嵌/反代壳（OntoProxyModule）</text>

    <!-- app -->
    <rect x="40" y="298" width="760" height="74" rx="12" fill="#111c33" stroke="#2b3a57"/>
    <text x="58" y="322" class="m cap" font-size="12">中立核 App · <tspan class="mono" fill="#e6ecf5">cmx-onto-app</tspan>（框架无关 handler，泛型 &lt;S: OntologyStore&gt;）</text>
    <g font-size="11.5" class="mono" fill="#cbd5e1">
      <text x="60" y="348">handlers</text><text x="150" y="348">object_handlers</text><text x="290" y="348">engine</text><text x="380" y="348">object_engine</text><text x="510" y="348">tenancy</text><text x="600" y="348">openapi</text><text x="690" y="348">dashboard</text>
      <text x="60" y="365" class="m" font-family="'Segoe UI',sans-serif">元模型 CRUD/发布 · 对象 upsert/查询 · 多租户 task_local · Swagger · 建模台</text>
    </g>

    <!-- store -->
    <rect x="40" y="394" width="760" height="74" rx="12" fill="#122036" stroke="#2b3a57"/>
    <text x="58" y="418" class="m cap" font-size="12">实现 Store · <tspan class="mono" fill="#e6ecf5">cmx-onto-store-pg</tspan>（tokio-postgres 落地 OntologyStore）</text>
    <g font-size="11.5" class="mono" fill="#cbd5e1">
      <text x="60" y="444">ddl（om_/oo_/ol_edge 建表）</text>
      <text x="330" y="444">compile（对象集代数 → 一条 SQL）</text>
      <text x="640" y="444">link_resolver</text>
      <text x="60" y="461" class="m" font-family="'Segoe UI',sans-serif">Per-Type 物化表 · 统一边表 · Search-Around 单表 JOIN · 事务 upsert · 聚合</text>
    </g>

    <!-- core/kernel -->
    <rect x="40" y="490" width="760" height="78" rx="12" fill="#0f1d38" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="58" y="514" class="cap" fill="#22d3ee" font-size="13">芯 Kernel · <tspan class="mono">cmx-onto-model</tspan> — 平台的心脏（零 IO · 框架无关 · 可单测）</text>
    <g font-size="12" class="mono" fill="#dbeafe">
      <text x="60" y="540">def（元模型类型）</text>
      <text x="250" y="540">store（OntologyStore 契约）</text>
      <text x="510" y="540">objectset（对象集代数）</text>
      <text x="60" y="558" class="m" font-family="'Segoe UI',sans-serif">ObjectType/PropertyType/LinkType/Interface/SharedProperty/ActionType/FunctionType + Version</text>
    </g>
  </g>

  <!-- dependency arrows (inward) -->
  <g stroke="#3a4d73" stroke-width="1.4" marker-end="url(#arr)" fill="none" opacity=".9">
    <line x1="418" y1="184" x2="418" y2="204"/>
    <line x1="418" y1="276" x2="418" y2="296"/>
    <line x1="418" y1="372" x2="418" y2="392"/>
    <line x1="418" y1="468" x2="418" y2="488"/>
  </g>
  <!-- DB -->
  <rect x="40" y="590" width="1120" height="86" rx="12" fill="#0e1730" stroke="#243049"/>
  <text x="58" y="614" class="m cap" font-size="12">持久化 · PostgreSQL（db-per-tenant）</text>
  <rect x="58" y="624" width="540" height="40" rx="8" fill="#0d1526" stroke="#334"/>
  <text x="72" y="642" class="t" font-size="12.5">元数据层 <tspan class="mono" fill="#f59e0b">om_*</tspan> · 7 表（对象/关系/接口/共享属性/动作/函数/版本）</text>
  <text x="72" y="658" class="m" font-size="11">本体定义的单一真相；发布落 om_version 快照</text>
  <rect x="612" y="624" width="536" height="40" rx="8" fill="#0d1526" stroke="#334"/>
  <text x="626" y="642" class="t" font-size="12.5">对象数据层 <tspan class="mono" fill="#22d3ee">oo_&lt;type&gt;</tspan> · <tspan class="mono" fill="#22d3ee">ol_edge</tspan></text>
  <text x="626" y="658" class="m" font-size="11">Per-Type 物化表（props JSONB）+ 统一关系边表</text>

  <line x1="600" y1="529" x2="600" y2="588" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" opacity=".8"/>
  <text x="612" y="575" class="m" font-size="10.5">元模型驱动物化 DDL</text>

  <text x="40" y="708" class="m" font-size="12">前端经门户 <tspan class="mono">F3 反代</tspan> 到本体壳的 <tspan class="mono">/api/native-pages</tspan> 与 <tspan class="mono">/api/onto/*</tspan>；壳内嵌或独立部署由 <tspan class="mono">urls.onto</tspan> 决定，前端字节一致。</text>
  <text x="40" y="732" class="m" font-size="12">同构参照 <tspan class="t">cmx-flowengine</tspan> / <tspan class="t">cmx-rulesengine</tspan>：本体是 metaKind 家族的第六元（DCT/DOC/FLX/RPT/RULE/<tspan fill="#22d3ee">ONTOLOGY</tspan>）。</text>
</svg>
