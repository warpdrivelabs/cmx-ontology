    <linearGradient id="llmG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="agentG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0e7490"/></linearGradient><linearGradient id="ontoG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="senseG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="actG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="nerveG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
    <radialGradient id="glowLlm" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowOnto" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity="0.4"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aSense" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aAct" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aNerve" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#818cf8"/></marker><marker id="aLlm" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#a78bfa"/></marker><marker id="aAgent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#22d3ee"/></marker><marker id="aOnto" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aEnt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#94a3b8"/></marker>
  </defs><rect x="1.5" y="1.5" width="1197" height="757" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="48" y="60" font-size="27" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0.3" opacity="1">本体解剖 · 语义即神经，动作即肌肉</text><text x="48" y="86" font-size="14.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">把 Palantir 式本体的每一类元素，映射为生命体的一个器官/系统</text><rect x="48" y="96" width="1104" height="52" rx="12" fill="#121b30" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="122" r="6" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="119" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">对象类型 Object Type</text><text x="92" y="137" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">oo_*</text><text x="350" y="128" font-size="14" fill="#34d399" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">器官 / 细胞</text><text x="520" y="128" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">业务实体的强类型定义(订单/客户/凭证)——身体的组成单元</text><rect x="48" y="156" width="1104" height="52" rx="12" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="182" r="6" fill="#818cf8" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="179" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">关系 Link Type</text><text x="92" y="197" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">ol_edge</text><text x="350" y="188" font-size="14" fill="#818cf8" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">神经连接</text><text x="520" y="188" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">对象之间的语义连线，信号沿其传导(下单→客户)</text><rect x="48" y="216" width="1104" height="52" rx="12" fill="#121b30" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="242" r="6" fill="#22d3ee" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="239" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">接口 Interface</text><text x="92" y="257" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">om_interface</text><text x="350" y="248" font-size="14" fill="#22d3ee" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">组织/系统</text><text x="520" y="248" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">跨对象的共性契约，如同"循环系统"横切多器官</text><rect x="48" y="276" width="1104" height="52" rx="12" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="302" r="6" fill="#38bdf8" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="299" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">共享属性 Shared Prop</text><text x="92" y="317" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">om_shared</text><text x="350" y="308" font-size="14" fill="#38bdf8" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">基因</text><text x="520" y="308" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">可复用的属性基元，保证同一语义处处一致</text><rect x="48" y="336" width="1104" height="52" rx="12" fill="#121b30" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="362" r="6" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="359" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">函数 Function(O5)</text><text x="92" y="377" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">om_function</text><text x="350" y="368" font-size="14" fill="#fbbf24" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">反射 / 感官</text><text x="520" y="368" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">FEEL/脚本计算——查询、派生、聚合，读世界并回传</text><rect x="48" y="396" width="1104" height="52" rx="12" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="422" r="6" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="419" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">动作 Action(O4)</text><text x="92" y="437" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">om_action</text><text x="350" y="428" font-size="14" fill="#fb7185" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">肌肉 / 肢体</text><text x="520" y="428" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">受治理的写入口：改对象 + 触发副作用，身体的"动手"</text><rect x="48" y="456" width="1104" height="52" rx="12" fill="#121b30" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="482" r="6" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="479" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">副作用 Side-Effect</text><text x="92" y="497" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">oe_outbox</text><text x="350" y="488" font-size="14" fill="#fb7185" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">肌腱 / 末梢</text><text x="520" y="488" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">起流程/算报表/webhook/通知——力达企业外部系统</text><rect x="48" y="516" width="1104" height="52" rx="12" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="542" r="6" fill="#818cf8" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="539" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">事件 / Outbox</text><text x="92" y="557" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">events/SSE</text><text x="350" y="548" font-size="14" fill="#818cf8" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">神经递质</text><text x="520" y="548" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">事务性投递 + 事件流，把动作与感知的信号可靠送达</text><rect x="48" y="576" width="1104" height="52" rx="12" fill="#121b30" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="602" r="6" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="599" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">数据集成 Funnel(O3)</text><text x="92" y="617" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">om_source</text><text x="350" y="608" font-size="14" fill="#fbbf24" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">消化 / 摄入</text><text x="520" y="608" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">把外部数据映射进本体(隔离区校验)——把食物变成养分</text><rect x="48" y="636" width="1104" height="52" rx="12" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="70" cy="662" r="6" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="92" y="659" font-size="14.5" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">数据权限 PDP/PEP</text><text x="92" y="677" font-size="11" fill="#5f7290" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">data-auth</text><text x="350" y="668" font-size="14" fill="#fbbf24" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">免疫系统</text><text x="520" y="668" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">决策/执行分离 + 残差约束，抵御越权(本次已为 report 补齐鉴权)</text></svg>