  </defs><rect x="1.5" y="1.5" width="1197" height="637" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="48" y="60" font-size="27" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0.3" opacity="1">行动系统 · 一个动作，多路副作用触达企业系统</text><text x="48" y="86" font-size="14.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">本体动作引擎(O4) → 事务性 Outbox → dispatcher 分派器 → 各企业系统连接器(真机已打通)</text><rect x="48" y="130" width="250" height="220" rx="16" fill="url(#actG)" stroke="#fb7185" stroke-width="1.4" opacity="1"/><text x="173" y="168" font-size="17" fill="#3d0716" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">动作引擎 O4</text><text x="173" y="190" font-size="11.5" fill="#5c0c22" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">Action Engine</text><text x="72" y="222" font-size="12.5" fill="#3d0716" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">① 校验参数 + FEEL 门</text><text x="72" y="250" font-size="12.5" fill="#3d0716" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">② 解析编辑(改对象)</text><text x="72" y="278" font-size="12.5" fill="#3d0716" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">③ 单事务写回 + 审计</text><text x="72" y="306" font-size="12.5" fill="#3d0716" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">④ 副作用入 Outbox</text><line x1="298" y1="240" x2="360" y2="240" stroke="#fb7185" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><rect x="360" y="150" width="200" height="180" rx="14" fill="#121b30" stroke="#818cf8" stroke-width="1.4" opacity="1"/><text x="460" y="184" font-size="16" fill="#818cf8" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">Dispatcher</text><text x="460" y="204" font-size="10.8" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">事务性投递 · SKIP LOCKED</text><text x="378" y="230" font-size="11.5" fill="#9fb0c