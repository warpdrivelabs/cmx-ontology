  </defs><rect x="1.5" y="1.5" width="1197" height="717" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="48" y="60" font-size="27" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0.3" opacity="1">认知闭环 · Sense → Think → Decide → Act → Learn</text><text x="48" y="86" font-size="14.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">企业智能体的 OODA 循环：一切从感知开始，以行动落地，用反馈进化</text><circle cx="600" cy="400" r="230" fill="none" stroke="#2b3a5c" stroke-width="1.2" opacity="0.6"/><path d="M600,170 A230,230 0 0 1 818.7429987478853,328.9260912937621" stroke="#fbbf24" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aSense)"/><circle cx="600" cy="170" r="62" fill="#121b30" stroke="#fbbf24" stroke-width="2" opacity="1"/><text x="600" y="164" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">感 知</text><text x="600" y="182" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">Sense</text><text x="600" y="254" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">本体读企业数据</text><text x="600" y="269" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">对象集/函数/搜索</text><path d="M818.7429987478853,328.9260912937621 A230,230 0 0 1 735.1906080272688,586.073908706238" stroke="#a78bfa" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aLlm)"/><circle cx="818.7429987478853" cy="328.9260912937621" r="62" fill="#121b30" stroke="#a78bfa" stroke-width="2" opacity="1"/><text x="818.7429987478853" y="322.9260912937621" font-size="17" fill="#a78bfa" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">认 知</text><text x="818.7429987478853" y="340.9260912937621" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">Think</text><text x="818.7429987478853" y="412.9260912937621" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">LLM 理解 + 推理</text><text x="818.7429987478853" y="427.9260912937621" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">结合本体上下文</text><path d="M735.1906080272688,586.073908706238 A230,230 0 0 1 464.8093919727312,586.073908706238" stroke="#22d3ee" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aAgent)"/><circle cx="735.1906080272688" cy="586.073908706238" r="62" fill="#121b30" stroke="#22d3ee" stroke-width="2" opacity="1"/><text x="735.1906080272688" y="580.073908706238" font-size="17" fill="#22d3ee" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">决 策</text><text x="735.1906080272688" y="598.073908706238" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">Decide</text><text x="735.1906080272688" y="670.073908706238" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">Agent 编排动作</text><text x="735.1906080272688" y="685.073908706238" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">HITL 审批闸门</text><path d="M464.8093919727312,586.073908706238 A230,230 0 0 1 381.2570012521147,328.92609129376206" stroke="#fb7185" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aAct)"/><circle cx="464.8093919727312" cy="586.073908706238" r="62" fill="#121b30" stroke="#fb7185" stroke-width="2" opacity="1"/><text x="464.8093919727312" y="580.073908706238" font-size="17" fill="#fb7185" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">行 动</text><text x="464.8093919727312" y="598.073908706238" font-size="11" fill="#9fb0cc" text-anchor