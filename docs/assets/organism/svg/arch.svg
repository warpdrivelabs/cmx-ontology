  </defs><rect x="1.5" y="1.5" width="1197" height="717" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="48" y="60" font-size="27" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0.3" opacity="1">总体架构 · 四层解剖</text><text x="48" y="86" font-size="14.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">思考层(LLM) → 决策层(Agent) → 肌体层(本体) → 执行对象层(企业系统)，纵向一条感知-行动神经贯通</text><rect x="48" y="96" width="300" height="118" rx="16" fill="url(#llmG)" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="72" y="136" font-size="18" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">① 思考层 · 大脑</text><rect x="72" y="154" width="45.8" height="24" rx="12" fill="#0b112022" stroke="#0b1120" stroke-width="1" opacity="1"/><text x="94.9" y="170" font-size="12.5" fill="#0b1120" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">LLM</text><rect x="372" y="96" width="780" height="118" rx="16" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="399" cy="126" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="130" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">自然语言理解意图 / 多轮对话 / 任务拆解</text><circle cx="787" cy="126" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="130" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">基于本体上下文的推理与规划(RAG/工具调用)</text><circle cx="399" cy="168" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="172" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">生成结构化「行动意图」交给 Agent</text><circle cx="787" cy="168" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="172" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">记忆：短时(会话) + 长时(向量/图谱)</text><line x1="198" y1="214" x2="198" y2="238" stroke="#818cf8" stroke-width="4" opacity="1" stroke-linecap="round" stroke-dasharray="2 6" marker-end="url(#aNerve)"/><rect x="48" y="238" width="300" height="118" rx="16" fill="url(#agentG)" stroke="#22d3ee" stroke-width="1.5" opacity="1"/><text x="72" y="278" font-size="18" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">② 决策层 · 小脑</text><rect x="72" y="296" width="63" height="24" rx="12" fill="#0b112022" stroke="#0b1120" stroke-width="1" opacity="1"/><text x="103.5" y="312" font-size="12.5" fill="#0b1120" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">Agent</text><rect x="372" y="238" width="780" height="118" rx="16" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="399" cy="268" r="3.5" fill="#22d3ee" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="272" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">把意图编排为动作序列(ReAct / Plan-Execute)</text><circle cx="787" cy="268" r="3.5" fill="#22d3ee" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="272" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">工具选择 = 选本体「动作 / 函数 / 对象集」</text><circle cx="399" cy="310" r="3.5" fill="#22d3ee" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="314" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">人在环(HITL)审批闸门 · 失败重试 · 补偿</text><circle cx="787" cy="310" r="3.5" fill="#22d3ee" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="314" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">并发/依赖调度 · 预演(dry-run)后提交</text><line x1="198" y1="356" x2="198" y2="380" stroke="#818cf8" stroke-width="4" opacity="1" stroke-linecap="round" stroke-dasharray="2 6" marker-end="url(#aNerve)"/><rect x="48" y="380" width="300" height="118" rx="16" fill="url(#ontoG)" stroke="#34d399" stroke-width="1.5" opacity="1"/><text x="72" y="420" font-size="18" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">③ 肌体层 · 本体</text><rect x="72" y="438" width="88.8" height="24" rx="12" fill="#0b112022" stroke="#0b1120" stroke-width="1" opacity="1"/><text x="116.4" y="454" font-size="12.5" fill="#0b1120" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">Ontology</text><rect x="372" y="380" width="780" height="118" rx="16" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="399" cy="410" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="414" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">语义模型：对象/关系/接口/共享属性(神经)</text><circle cx="787" cy="410" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="414" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">感知：数据集成/对象集/函数/搜索(感官)</text><circle cx="399" cy="452" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="456" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">行动：动作引擎 + 副作用 dispatcher(肌肉)</text><circle cx="787" cy="452" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="456" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">治理：数据权限 PDP/PEP · 审计 · Outbox</text><line x1="198" y1="498" x2="198" y2="522" stroke="#818cf8" stroke-width="4" opacity="1" stroke-linecap="round" stroke-dasharray="2 6" marker-end="url(#aNerve)"/><rect x="48" y="522" width="300" height="118" rx="16" fill="#121b30" stroke="#94a3b8" stroke-width="1.5" opacity="1"/><text x="72" y="562" font-size="18" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">④ 执行对象层 · 企业系统</text><rect x="72" y="580" width="80.19999999999999" height="24" rx="12" fill="#94a3b822" stroke="#94a3b8" stroke-width="1" opacity="1"/><text x="112.1" y="596" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">Systems</text><rect x="372" y="522" width="780" height="118" rx="16" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><circle cx="399" cy="552" r="3.5" fill="#94a3b8" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="556" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">ERP / CRM / OA / MES / 主数据</text><circle cx="787" cy="552" r="3.5" fill="#94a3b8" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="556" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">流程引擎 · 报表平台 · 规则引擎</text><circle cx="399" cy="594" r="3.5" fill="#94a3b8" stroke="none" stroke-width="1" opacity="1"/><text x="412" y="598" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">数据库 · 消息队列 · 三方 Webhook</text><circle cx="787" cy="594" r="3.5" fill="#94a3b8" stroke="none" stroke-width="1" opacity="1"/><text x="800" y="598" font-size="13.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">文件/文档/IoT —— 既是感知源也是行动对象</text></svg>