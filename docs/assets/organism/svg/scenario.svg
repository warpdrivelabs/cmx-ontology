  </defs><rect x="1.5" y="1.5" width="1197" height="717" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="48" y="58" font-size="27" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0.3" opacity="1">端到端场景 · "帮我把 3 月关账"</text><text x="48" y="84" font-size="14.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">一句自然语言，穿过大脑→小脑→本体→企业系统，再把结果回流——全链路真机能力已具备</text><rect x="42" y="92" width="156" height="34" rx="10" fill="#121b30" stroke="#e8eefc" stroke-width="1.3" opacity="1"/><text x="120" y="114" font-size="13.5" fill="#e8eefc" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">用户</text><line x1="120" y1="130" x2="120" y2="660" stroke="#2b3a5c" stroke-width="1" opacity="1" stroke-linecap="round" stroke-dasharray="3 7"/><rect x="262" y="92" width="156" height="34" rx="10" fill="#121b30" stroke="#a78bfa" stroke-width="1.3" opacity="1"/><text x="340" y="114" font-size="13.5" fill="#a78bfa" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">大脑 LLM</text><line x1="340" y1="130" x2="340" y2="660" stroke="#2b3a5c" stroke-width="1" opacity="1" stroke-linecap="round" stroke-dasharray="3 7"/><rect x="482" y="92" width="156" height="34" rx="10" fill="#121b30" stroke="#22d3ee" stroke-width="1.3" opacity="1"/><text x="560" y="114" font-size="13.5" fill="#22d3ee" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">小脑 Agent</text><line x1="560" y1="130" x2="560" y2="660" stroke="#2b3a5c" stroke-width="1" opacity="1" stroke-linecap="round" stroke-dasharray="3 7"/><rect x="712" y="92" width="156" height="34" rx="10" fill="#121b30" stroke="#34d399" stroke-width="1.3" opacity="1"/><text x="790" y="114" font-size="13.5" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">本体 Ontology</text><line x1="790" y1="130" x2="790" y2="660" stroke="#2b3a5c" stroke-width="1" opacity="1" stroke-linecap="round" stroke-dasharray="3 7"/><rect x="962" y="92" width="156" height="34" rx="10" fill="#121b30" stroke="#94a3b8" stroke-width="1.3" opacity="1"/><text x="1040" y="114" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">企业系统</text><line x1="1040" y1="130" x2="1040" y2="660" stroke="#2b3a5c" stroke-width="1" opacity="1" stroke-linecap="round" stroke-dasharray="3 7"/><line x1="126" y1="168" x2="332" y2="168" stroke="#e8eefc" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="230" y="160" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">"帮我把 3 月关账并出资产负债表"</text><line x1="346" y1="212" x2="782" y2="212" stroke="#a78bfa" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="565" y="204" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">① 读本体：查关账动作/报表/组织期间(感知)</text><line x1="784" y1="256" x2="348" y2="256" stroke="#34d399" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aOk)"/><text x="565" y="248" font-size="12.2" fill="#34d399" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">返回可用「动作模板 consolClose」+ 参数形状</text><line x1="346" y1="300" x2="552" y2="300" stroke="#a78bfa" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="450" y="292" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">② 生成行动意图：org=CSCEC, period=2025-03</text><path d="M560,338 q70,10 0,26" stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aAgent)"/><text x="644" y="350" font-size="12.2" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">③ 编排：dry-run 预演 → 呈现给用户确认(HITL)</text><line x1="566" y1="388" x2="782" y2="388" stroke="#22d3ee" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="675" y="380" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">④ execute 关账联动动作</text><line x1="796" y1="432" x2="1032" y2="432" stroke="#fb7185" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="915" y="424" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">⑤ startBusinessProcess → 起关账审批流</text><line x1="796" y1="476" x2="1032" y2="476" stroke="#fb7185" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aAct)"/><text x="915" y="468" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">⑥ computeReport → 真算资产负债表落库</text><line x1="1034" y1="520" x2="798" y2="520" stroke="#94a3b8" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aFg)"/><text x="915" y="512" font-size="12.2" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">实例已建 + cr_cell_data 已写(结果)</text><line x1="784" y1="564" x2="348" y2="564" stroke="#34d399" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aOk)"/><text x="565" y="556" font-size="12.2" fill="#34d399" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">⑦ 事件/结果回流(反馈)</text><line x1="334" y1="608" x2="128" y2="608" stroke="#34d399" stroke-width="1.9" opacity="1" stroke-linecap="round" marker-end="url(#aOk)"/><text x="230" y="600" font-size="12.2" fill="#34d399" text-anchor="middle" font-weight="600" letter-spacing="0" opacity="1">"已发起关账审批(实例#c5a8)，BS 已生成，待复核"</text></svg>