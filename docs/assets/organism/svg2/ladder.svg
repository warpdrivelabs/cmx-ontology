<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="557" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">写系统级记录的阶梯 · 从只读到过账，逐级加闸</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">"更新 ERP"不是一句话的卖点，是一条从安全到危险的阶梯——当前只应站在下三级</text><rect x="120" y="106" width="640" height="56" rx="12" fill="#0e1526" stroke="#34d399" stroke-width="1.4" opacity="1"/><circle cx="140" cy="134" r="5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="156" y="130" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">① 只读感知</text><text x="156" y="149" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">读 ERP / 生成对象集 / 函数计算</text><rect x="664" y="123" width="35.2" height="23" rx="11" fill="#34d39922" stroke="#34d399" stroke-width="1" opacity="1"/><text x="681.6" y="138.5" font-size="12" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">安全</text><line x1="150" y1="162" x2="228" y2="180" stroke="#2b3a5c" stroke-width="2" opacity="1" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="198" y="180" width="640" height="56" rx="12" fill="#0e1526" stroke="#34d399" stroke-width="1.4" opacity="1"/><circle cx="218" cy="208" r="5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="234" y="204" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">② 生成建议(草稿)</text><text x="234" y="223" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">AI 备好分录/单据草稿，不写任何系统</text><rect x="742" y="197" width="35.2" height="23" rx="11" fill="#34d39922" stroke="#34d399" stroke-width="1" opacity="1"/><text x="759.6" y="212.5" font-size="12" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">安全</text><line x1="228" y1="236" x2="306" y2="254" stroke="#2b3a5c" stroke-width="2" opacity="1" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="276" y="254" width="640" height="56" rx="12" fill="#0e1526" stroke="#34d399" stroke-width="1.4" opacity="1"/><circle cx="296" cy="282" r="5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="312" y="278" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">③ 人工执行</text><text x="312" y="297" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">人在 ERP 内亲手执行，AI 只做辅助</text><rect x="820" y="271" width="78.19999999999999" height="23" rx="11" fill="#34d39922" stroke="#34d399" stroke-width="1" opacity="1"/><text x="859.1" y="286.5" font-size="12" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">安全·当前上限</text><line x1="306" y1="310" x2="384" y2="328" stroke="#2b3a5c" stroke-width="2" opacity="1" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="354" y="328" width="640" height="56" rx="12" fill="#0e1526" stroke="#fbbf24" stroke-width="1.4" opacity="1"/><circle cx="374" cy="356" r="5" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="390" y="352" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">④ 受控自动写·可逆</text><text x="390" y="371" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">自动写可撤销的更新 + 立即可回滚</text><rect x="898" y="345" width="43.8" height="23" rx="11" fill="#fbbf2422" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="919.9" y="360.5" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">需设计</text><line x1="384" y1="384" x2="462" y2="402" stroke="#2b3a5c" stroke-width="2" opacity="1" stroke-linecap="round" stroke-dasharray="3 5"/><rect x="432" y="402" width="640" height="56" rx="12" fill="#0e1526" stroke="#fb7185" stroke-width="1.4" opacity="1"/><circle cx="452" cy="430" r="5" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="468" y="426" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">⑤ 受控自动写·不可逆(GL过账)</text><text x="468" y="445" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">须 SoD 职责分离 + 双人复核 + 完整审计 + 监管合规</text><rect x="976" y="419" width="69.6" height="23" rx="11" fill="#fb718522" stroke="#fb7185" stroke-width="1" opacity="1"/><text x="1010.8" y="434.5" font-size="12" fill="#fb7185" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">远期·勿轻言</text><rect x="760" y="380" width="396" height="130" rx="12" fill="#fb718510" stroke="#fb7185" stroke-width="1.2" opacity="1"/><text x="778" y="408" font-size="14" fill="#fb7185" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">危险区 (④⑤)</text><text x="778" y="434" font-size="12.2" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">"一个 AI 决定这么过账"</text><text x="778" y="454" font-size="12.2" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不是可接受的审计轨迹。</text><text x="778" y="474" font-size="12.2" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">拦路虎是组织/合规/法律，</text><text x="778" y="494" font-size="12.2" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不是技术——上一版没提。</text></svg>