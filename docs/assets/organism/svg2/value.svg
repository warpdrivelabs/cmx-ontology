<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="517" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">本体的可辩护价值：受治理的动作边界，不是语义乌托邦</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">别为"统一语义层"辩护(那是历史坟场)；为"把不可信大脑的动作拦在最后一米"辩护</text><rect x="44" y="104" width="540" height="360" rx="16" fill="#0e1526" stroke="#fb7185" stroke-width="1.5" opacity="1"/><rect x="44" y="104" width="540" height="48" rx="16" fill="#fb718518" stroke="none" stroke-width="1" opacity="1"/><text x="64" y="135" font-size="15.5" fill="#fb7185" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">裸 API 直调(LLM → API)</text>✕<text x="68" y="188" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 无 schema：LLM 靠猜参数</text>✕<text x="68" y="226" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 无前置校验：错参直达生产</text>✕<text x="68" y="264" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 无事务：半成品状态</text>✕<text x="68" y="302" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 无审计：谁决定的?说不清</text>✕<text x="68" y="340" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 无权限门：越权无感</text>✕<text x="68" y="378" font-size="13.2" fill="#9fb0cc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✕ 幻觉 → 直接落到系统</text><rect x="60" y="410" width="508" height="40" rx="10" fill="#fb718512" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="435" font-size="12.5" fill="#fb7185" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">风险：忠实执行一个会confabulate的大脑</text><rect x="616" y="104" width="540" height="360" rx="16" fill="#0e1526" stroke="#34d399" stroke-width="1.5" opacity="1"/><rect x="616" y="104" width="540" height="48" rx="16" fill="#34d39918" stroke="none" stroke-width="1" opacity="1"/><text x="636" y="135" font-size="15.5" fill="#34d399" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">受治理动作边界(经本体)</text>✓<text x="640" y="188" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ 强类型参数 + 形状约束</text>✓<text x="640" y="226" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ FEEL 前置校验闸</text>✓<text x="640" y="264" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ 本地事务 + 幂等</text>✓<text x="640" y="302" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ 全程审计(动作/参数/结果)</text>✓<text x="640" y="340" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ PDP/PEP 数据权限</text>✓<text x="640" y="378" font-size="13.2" fill="#e8eefc" text-anchor="start" font-weight="500" letter-spacing="0" opacity="1">✓ 幻觉 → 被拦在最后一米</text><rect x="632" y="410" width="508" height="40" rx="10" fill="#34d39912" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="435" font-size="12.5" fill="#34d399" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">价值：动作可治理、可审计、可回滚</text><text x="44" y="500" font-size="12.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">注：这个价值与"生命体隐喻"无关，拆掉隐喻它照样成立——它是纯工程与治理的资产。</text></svg>