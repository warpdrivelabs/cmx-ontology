<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="637" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">可靠性数学：为什么"长链自主"必然崩</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">端到端成功率 = 单步可靠率 ^ 步数。这条曲线，上一版只字未提</text><line x1="110" y1="520" x2="830" y2="520" stroke="#2b3a5c" stroke-width="1.4" opacity="1" stroke-linecap="round"/><line x1="110" y1="520" x2="110" y2="120" stroke="#2b3a5c" stroke-width="1.4" opacity="1" stroke-linecap="round"/><line x1="105" y1="520" x2="830" y2="520" stroke="#1c2740" stroke-width="0.8" opacity="0.5" stroke-linecap="round" stroke-dasharray="2 6"/><text x="98" y="524" font-size="11.5" fill="#9fb0cc" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">0%</text><line x1="105" y1="420" x2="830" y2="420" stroke="#1c2740" stroke-width="0.8" opacity="0.5" stroke-linecap="round" stroke-dasharray="2 6"/><text x="98" y="424" font-size="11.5" fill="#9fb0cc" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">25%</text><line x1="105" y1="320" x2="830" y2="320" stroke="#1c2740" stroke-width="0.8" opacity="0.5" stroke-linecap="round" stroke-dasharray="2 6"/><text x="98" y="324" font-size="11.5" fill="#9fb0cc" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">50%</text><line x1="105" y1="220" x2="830" y2="220" stroke="#1c2740" stroke-width="0.8" opacity="0.5" stroke-linecap="round" stroke-dasharray="2 6"/><text x="98" y="224" font-size="11.5" fill="#9fb0cc" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">75%</text><line x1="105" y1="120" x2="830" y2="120" stroke="#1c2740" stroke-width="0.8" opacity="0.5" stroke-linecap="round" stroke-dasharray="2 6"/><text x="98" y="124" font-size="11.5" fill="#9fb0cc" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">100%</text><text x="110" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">1</text><text x="240.9090909090909" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">3</text><text x="371.8181818181818" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">5</text><text x="502.7272727272727" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">7</text><text x="633.6363636363636" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">9</text><text x="764.5454545454545" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">11</text><text x="830" y="540" font-size="11.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">12</text><text x="470" y="562" font-size="12.5" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">动作链步数 n →</text><path d="M110,124 L175.45454545454544,127.96000000000004 L240.9090909090909,131.8804 L306.3636363636364,135.761596 L371.8181818181818,139.60398004 L437.27272727272725,143.4079402396 L502.7272727272727,147.17386083720402 L568.1818181818182,150.90212222883196 L633.6363636363636,154.5931010065437 L699.0909090909091,158.24716999647825 L764.5454545454545,161.86469829651344 L830,165.4460513135483 " stroke="#34d399" stroke-width="2.6" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="830" cy="165.4460513135483" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="838" y="169.4460513135483" font-size="12" fill="#34d399" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">89%</text><path d="M110,140 L175.45454545454544,159 L240.9090909090909,177.05000000000007 L306.3636363636364,194.19750000000005 L371.8181818181818,210.4876250000001 L437.27272727272725,225.96324375000006 L502.7272727272727,240.66508156250012 L568.1818181818182,254.6318274843751 L633.6363636363636,267.90023611015636 L699.0909090909091,280.50522430464855 L764.5454545454545,292.4799630894162 L830,303.85596493494535 " stroke="#fbbf24" stroke-width="2.6" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="830" cy="303.85596493494535" r="4" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="838" y="307.85596493494535" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">54%</text><path d="M110,160 L175.45454545454544,196 L240.9090909090909,228.39999999999998 L306.3636363636364,257.56 L371.8181818181818,283.804 L437.27272727272725,307.42359999999996 L502.7272727272727,328.68124 L568.1818181818182,347.8131159999999 L633.6363636363636,365.03180439999994 L699.0909090909091,380.52862395999995 L764.5454545454545,394.475761564 L830,407.02818540759995 " stroke="#fb7185" stroke-width="2.6" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="830" cy="407.02818540759995" r="4" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="838" y="411.02818540759995" font-size="12" fill="#fb7185" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">28%</text><circle cx="699.0909090909091" cy="380.52862395999995" r="5" fill="none" stroke="#fb7185" stroke-width="2" opacity="1"/><text x="693.0909090909091" y="366.52862395999995" font-size="11.5" fill="#fb7185" text-anchor="end" font-weight="400" letter-spacing="0" opacity="1">0.90^10≈35%</text><circle cx="122" cy="138" r="5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="136" y="142" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">r=0.99 每步</text><circle cx="122" cy="160" r="5" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="136" y="164" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">r=0.95</text><circle cx="122" cy="182" r="5" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="136" y="186" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">r=0.90</text><rect x="880" y="110" width="276" height="420" rx="14" fill="#0e1526" stroke="#38bdf8" stroke-width="1.3" opacity="1"/><text x="898" y="140" font-size="15" fill="#38bdf8" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">结论</text><text x="898" y="168" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">单步再可靠，链一长就崩：</text><text x="898" y="195" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 0.95 单步 → 10 步仅 ~60%</text><text x="898" y="222" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 财务/不可逆动作不容 40% 翻车</text><text x="898" y="249" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1"></text><text x="898" y="276" font-size="12.3" fill="#fbbf24" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">对策：不是"追求更长自主"，</text><text x="898" y="303" font-size="12.3" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">而是缩短自主步长 + 在</text><text x="898" y="330" font-size="12.3" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不可逆步骤前设「人闸门」，</text><text x="898" y="357" font-size="12.3" fill="#fbbf24" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">让误差累积在闸门处重置。</text><text x="898" y="384" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1"></text><text x="898" y="411" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="700" letter-spacing="0" opacity="1">HITL 不是可选项，是数学</text><text x="898" y="438" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">逼出来的必需品——但它也</text><text x="898" y="465" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">意味着：高风险处 AI 自主性</text><text x="898" y="492" font-size="12.3" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">≈ 0。这是内在张力，非 bug。</text></svg>