<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="637" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">楔子：只切一条纵向价值切片(月末关账)</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不铺平台。一条工作流端到端跑通、量化 ROI，再谈横向——写系统级记录处显式设人闸</text><rect x="44" y="110" width="210" height="84" rx="14" fill="#121b30" stroke="#38bdf8" stroke-width="1.5" opacity="1"/><text x="149" y="144" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">感知(读)</text><text x="149" y="168" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">对象集/函数只读</text><line x1="254" y1="152" x2="272" y2="152" stroke="#9fb0cc" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#aFg)"/><rect x="272" y="110" width="210" height="84" rx="14" fill="#121b30" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><text x="377" y="144" font-size="15" fill="#a78bfa" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">LLM 建议</text><text x="377" y="168" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">org+period→意图</text><line x1="482" y1="152" x2="500" y2="152" stroke="#9fb0cc" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#aFg)"/><rect x="500" y="110" width="210" height="84" rx="14" fill="#121b30" stroke="#fbbf24" stroke-width="1.5" opacity="1"/><text x="605" y="144" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">人工审批</text><text x="605" y="168" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">dry-run→确认</text><line x1="710" y1="152" x2="728" y2="152" stroke="#9fb0cc" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#aFg)"/><rect x="728" y="110" width="210" height="84" rx="14" fill="url(#okG)" stroke="#34d399" stroke-width="1.5" opacity="1"/><text x="833" y="144" font-size="15" fill="#0b1120" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">执行·已验证</text><text x="833" y="168" font-size="11" fill="#0b3b2a" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">flow起实例+report出表</text><line x1="938" y1="152" x2="956" y2="152" stroke="#fb7185" stroke-width="2" opacity="1" stroke-linecap="round" marker-end="url(#aBad)"/><rect x="956" y="110" width="210" height="84" rx="14" fill="#121b30" stroke="#fb7185" stroke-width="1.5" opacity="1" stroke-dasharray="6 5"/><text x="1061" y="144" font-size="15" fill="#fb7185" text-anchor="middle" font-weight="800" letter-spacing="0" opacity="1">ERP 过账·高风险</text><text x="1061" y="168" font-size="11" fill="#9fb0cc" text-anchor="middle" font-weight="400" letter-spacing="0" opacity="1">过账 = 不可逆</text><rect x="44" y="210" width="894" height="30" rx="9" fill="#34d39914" stroke="#34d399" stroke-width="1" opacity="1" stroke-dasharray="4 4"/><text x="58" y="230" font-size="12.5" fill="#34d399" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">① 这一段"本体→flow/report"已真机跑通(关账联动模板)——安全区，可先上</text><rect x="956" y="210" width="210" height="116" rx="12" fill="#fb718510" stroke="#fb7185" stroke-width="1.3" opacity="1"/><text x="968" y="232" font-size="13.5" fill="#fb7185" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">② ERP 过账闸门</text><text x="968" y="254" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 先降级为"生成分录草稿"</text><text x="968" y="272" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 人在 ERP 内执行(职责分离)</text><text x="968" y="290" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 远期才谈受控自动写</text><text x="968" y="308" font-size="11.5" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">· 须双人复核 + 完整审计</text><rect x="44" y="500" width="1112" height="92" rx="14" fill="#0e1526" stroke="#1c2740" stroke-width="1" opacity="1"/><text x="64" y="528" font-size="14" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">为什么不"先铺四层平台"?</text><text x="64" y="552" font-size="12.8" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">没有真实 agent 用例，你根本不知道该建什么本体/动作——先铺平台=大概率建错身体、过度建模、又漏建真正需要的。</text><text x="64" y="574" font-size="12.8" fill="#34d399" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">切片优先：一条纵切验证价值与失败处理 → ROI 达标再横向复制；每片都能独立止损。</text></svg>