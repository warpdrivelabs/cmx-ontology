<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="517" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">务实路线图 · 薄纵切片，每片可独立止损</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不是 P0→P4 横向铺层；是一片一片纵切，每片之间有"决策/止损闸"</text><rect x="44" y="108" width="250" height="300" rx="16" fill="#0e1526" stroke="#34d399" stroke-width="1.5" opacity="1"/><rect x="44" y="108" width="250" height="60" rx="16" fill="#34d39918" stroke="none" stroke-width="1" opacity="1"/><text x="62" y="135" font-size="15" fill="#34d399" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">切片 1</text><text x="62" y="156" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">月末关账(读+建议+人执行)</text><circle cx="65" cy="196" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="78" y="204" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">最小本体(已具备)</text><circle cx="65" cy="230" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="78" y="238" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">最小 agent 编排</text><circle cx="65" cy="264" r="3.5" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="78" y="272" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">写侧只到"③人执行"</text><rect x="62" y="370" width="35.2" height="23" rx="11" fill="#34d39922" stroke="#34d399" stroke-width="1" opacity="1"/><text x="79.6" y="385.5" font-size="12" fill="#34d399" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">先上</text><path d="M294,258 L328,258" stroke="#2b3a5c" stroke-width="2" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aFg)"/><text x="311" y="246" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">闸</text><circle cx="311" cy="258" r="12" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="1"/><rect x="328" y="108" width="250" height="300" rx="16" fill="#0e1526" stroke="#fbbf24" stroke-width="1.5" opacity="1"/><rect x="328" y="108" width="250" height="60" rx="16" fill="#fbbf2418" stroke="none" stroke-width="1" opacity="1"/><text x="346" y="135" font-size="15" fill="#fbbf24" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">切片 2</text><text x="346" y="156" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">同工作流 +可逆自动写</text><circle cx="349" cy="196" r="3.5" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="362" y="204" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">④受控自动写</text><circle cx="349" cy="230" r="3.5" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="362" y="238" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">补偿/对账矩阵</text><circle cx="349" cy="264" r="3.5" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="362" y="272" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">SoD 设计</text><rect x="346" y="370" width="52.4" height="23" rx="11" fill="#fbbf2422" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="372.2" y="385.5" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">过闸再上</text><path d="M578,258 L612,258" stroke="#2b3a5c" stroke-width="2" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aFg)"/><text x="595" y="246" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">闸</text><circle cx="595" cy="258" r="12" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="1"/><rect x="612" y="108" width="250" height="300" rx="16" fill="#0e1526" stroke="#38bdf8" stroke-width="1.5" opacity="1"/><rect x="612" y="108" width="250" height="60" rx="16" fill="#38bdf818" stroke="none" stroke-width="1" opacity="1"/><text x="630" y="135" font-size="15" fill="#38bdf8" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">切片 3</text><text x="630" y="156" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">第二个高价值工作流</text><circle cx="633" cy="196" r="3.5" fill="#38bdf8" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="204" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">复用护栏/审计</text><circle cx="633" cy="230" r="3.5" fill="#38bdf8" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="238" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">横向复制模式</text><circle cx="633" cy="264" r="3.5" fill="#38bdf8" stroke="none" stroke-width="1" opacity="1"/><text x="646" y="272" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">扩连接器</text><rect x="630" y="370" width="35.2" height="23" rx="11" fill="#fbbf2422" stroke="#fbbf24" stroke-width="1" opacity="1"/><text x="647.6" y="385.5" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">复制</text><path d="M862,258 L896,258" stroke="#2b3a5c" stroke-width="2" fill="none" opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aFg)"/><text x="879" y="246" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">闸</text><circle cx="879" cy="258" r="12" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="1"/><rect x="896" y="108" width="250" height="300" rx="16" fill="#0e1526" stroke="#a78bfa" stroke-width="1.5" opacity="1"/><rect x="896" y="108" width="250" height="60" rx="16" fill="#a78bfa18" stroke="none" stroke-width="1" opacity="1"/><text x="914" y="135" font-size="15" fill="#a78bfa" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">成熟</text><text x="914" y="156" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">多工作流 + 多智能体</text><circle cx="917" cy="196" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="930" y="204" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">沉淀记忆</text><circle cx="917" cy="230" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="930" y="238" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">主动建议(仍人确认)</text><circle cx="917" cy="264" r="3.5" fill="#a78bfa" stroke="none" stroke-width="1" opacity="1"/><text x="930" y="272" font-size="12" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">谈"自主"须极谨慎</text><rect x="914" y="370" width="35.2" height="23" rx="11" fill="#5f729022" stroke="#5f7290" stroke-width="1" opacity="1"/><text x="931.6" y="385.5" font-size="12" fill="#5f7290" text-anchor="middle" font-weight="700" letter-spacing="0" opacity="1">愿景</text><text x="44" y="470" font-size="12.5" fill="#fbbf24" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">每个"闸"= 止损点：ROI/可靠性/合规未达标就停在这，不往危险侧走。这才是对抗性思维下的推进方式。</text></svg>