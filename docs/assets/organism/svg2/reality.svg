<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"><defs><linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#070b16"/></linearGradient><linearGradient id="okG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient><linearGradient id="warnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient><linearGradient id="badG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset="1" stop-color="#be123c"/></linearGradient><linearGradient id="blueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0369a1"/></linearGradient><marker id="aFg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#9fb0cc"/></marker><marker id="aOk" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#34d399"/></marker><marker id="aWarn" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fbbf24"/></marker><marker id="aBad" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#fb7185"/></marker><marker id="aBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0.5,0.5 L8,4 L0.5,7.5 L3,4 Z" fill="#38bdf8"/></marker></defs><rect x="1.5" y="1.5" width="1197" height="697" rx="24" fill="url(#bgG)" stroke="#18223c"/><text x="44" y="58" font-size="26" fill="#e8eefc" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">现状诚实地图 · 别让信心从左列溢价到右列</text><text x="44" y="83" font-size="14" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">把每项能力如实贴标：已验证 / 未验证的假设 / 未建或高风险——区分"做过"和"以为能做"</text><rect x="44" y="96" width="372" height="40" rx="12" fill="url(#okG)" stroke="none" stroke-width="1" opacity="1"/><text x="62" y="122" font-size="15.5" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">已验证 · 真机跑通</text><rect x="44" y="148" width="372" height="52" rx="11" fill="#0e1526" stroke="#34d399" stroke-width="1.1" opacity="1"/><circle cx="60" cy="168" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="172" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">本体：对象/关系/动作O4/函数O5</text><text x="74" y="189" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">强类型 + 前置校验 + 事务 + 审计</text><rect x="44" y="208" width="372" height="52" rx="11" fill="#0e1526" stroke="#34d399" stroke-width="1.1" opacity="1"/><circle cx="60" cy="228" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="232" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">数据集成 O3 · 数据权限 PDP/PEP</text><text x="74" y="249" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">report 鉴权门本次刚补齐</text><rect x="44" y="268" width="372" height="52" rx="11" fill="#0e1526" stroke="#34d399" stroke-width="1.1" opacity="1"/><circle cx="60" cy="288" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="292" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">双服务联动(flow/report)</text><text x="74" y="309" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">startBusinessProcess + computeReport 真机</text><rect x="44" y="328" width="372" height="52" rx="11" fill="#0e1526" stroke="#34d399" stroke-width="1.1" opacity="1"/><circle cx="60" cy="348" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="352" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">出站护栏 + 事务性 Outbox + dispatcher</text><text x="74" y="369" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">SSRF白名单 · 失败/熄火 · 错误回传</text><rect x="44" y="388" width="372" height="52" rx="11" fill="#0e1526" stroke="#34d399" stroke-width="1.1" opacity="1"/><circle cx="60" cy="408" r="4" fill="#34d399" stroke="none" stroke-width="1" opacity="1"/><text x="74" y="412" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">可视化配置 + 关账联动模板</text><text x="74" y="429" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">一动作串流程+报表(注意爆炸半径)</text><rect x="428" y="96" width="372" height="40" rx="12" fill="url(#warnG)" stroke="none" stroke-width="1" opacity="1"/><text x="446" y="122" font-size="15.5" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">假设 · 未经验证</text><rect x="428" y="148" width="372" height="52" rx="11" fill="#0e1526" stroke="#fbbf24" stroke-width="1.1" opacity="1"/><circle cx="444" cy="168" r="4" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="458" y="172" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">LLM 意图→动作的可靠性</text><text x="458" y="189" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">多步复利误差未量化(见图3)</text><rect x="428" y="208" width="372" height="52" rx="11" fill="#0e1526" stroke="#fbbf24" stroke-width="1.1" opacity="1"/><circle cx="444" cy="228" r="4" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="458" y="232" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">本体 RAG 上下文"够用"</text><text x="458" y="249" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">大 schema 的检索/裁剪未验证</text><rect x="428" y="268" width="372" height="52" rx="11" fill="#0e1526" stroke="#fbbf24" stroke-width="1.1" opacity="1"/><circle cx="444" cy="288" r="4" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="458" y="292" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">"反馈=学习"</text><text x="458" y="309" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">权重冻结，实为塞 RAG，非进化</text><rect x="428" y="328" width="372" height="52" rx="11" fill="#0e1526" stroke="#fbbf24" stroke-width="1.1" opacity="1"/><circle cx="444" cy="348" r="4" fill="#fbbf24" stroke="none" stroke-width="1" opacity="1"/><text x="458" y="352" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">HITL 不退化成橡皮图章</text><text x="458" y="369" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">规模化后疲劳性盖章风险</text><rect x="812" y="96" width="372" height="40" rx="12" fill="url(#badG)" stroke="none" stroke-width="1" opacity="1"/><text x="830" y="122" font-size="15.5" fill="#0b1120" text-anchor="start" font-weight="800" letter-spacing="0" opacity="1">未建 · 或高风险</text><rect x="812" y="148" width="372" height="52" rx="11" fill="#0e1526" stroke="#fb7185" stroke-width="1.1" opacity="1"/><circle cx="828" cy="168" r="4" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="842" y="172" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">Agent 编排器(小脑)</text><text x="842" y="189" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">整章未写，最难的部分</text><rect x="812" y="208" width="372" height="52" rx="11" fill="#0e1526" stroke="#fb7185" stroke-width="1.1" opacity="1"/><circle cx="828" cy="228" r="4" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="842" y="232" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">写系统级记录(ERP 过账)</text><text x="842" y="249" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">SOX/SoD/审计雷区，非技术问题</text><rect x="812" y="268" width="372" height="52" rx="11" fill="#0e1526" stroke="#fb7185" stroke-width="1.1" opacity="1"/><circle cx="828" cy="288" r="4" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="842" y="292" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">多步自主可靠性</text><text x="842" y="309" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">不可逆动作 × 复利误差</text><rect x="812" y="328" width="372" height="52" rx="11" fill="#0e1526" stroke="#fb7185" stroke-width="1.1" opacity="1"/><circle cx="828" cy="348" r="4" fill="#fb7185" stroke="none" stroke-width="1" opacity="1"/><text x="842" y="352" font-size="13" fill="#e8eefc" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">自愈 / 主动洞察(P4)</text><text x="842" y="369" font-size="11" fill="#9fb0cc" text-anchor="start" font-weight="400" letter-spacing="0" opacity="1">相对已展示能力=科幻</text><text x="44" y="686" font-size="12.5" fill="#fbbf24" text-anchor="start" font-weight="600" letter-spacing="0" opacity="1">⚠ 规则：左列的"做过"绝不能给中/右列的"以为能做"背书。整套系统的价值，卡在最右列那些最难、最没做的部分。</text></svg>